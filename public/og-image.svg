<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="50%" stop-color="#dfc08a"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle pattern -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Gold border -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Decorative gold lines -->
  <line x1="100" y1="180" x2="1100" y2="180" stroke="url(#gold)" stroke-width="0.5" opacity="0.2"/>
  <line x1="100" y1="450" x2="1100" y2="450" stroke="url(#gold)" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Logo mark -->
  <rect x="525" y="80" width="150" height="150" rx="20" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>
  <text x="600" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="bold" fill="url(#gold)">G</text>
  
  <!-- Brand name -->
  <text x="600" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="white" letter-spacing="4">GRAND OLIVA</text>
  
  <!-- Gold line under name -->
  <rect x="450" y="330" width="300" height="2" fill="url(#gold)" rx="1"/>
  
  <!-- Tagline -->
  <text x="600" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c9a96e" opacity="0.8" letter-spacing="6">PREMIUM OLIVES &amp; PICKLES</text>
  
  <!-- Arabic tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#888888" letter-spacing="2">أجود أنواع الزيتون والمخللات الطبيعية</text>
  
  <!-- Est. badge -->
  <rect x="490" y="470" width="220" height="36" rx="18" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <text x="600" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c9a96e" opacity="0.6" letter-spacing="4">EST. 1950 • MEDITERRANEAN</text>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="560" r="3" fill="#c9a96e" opacity="0.3"/>
  <circle cx="120" cy="560" r="2" fill="#c9a96e" opacity="0.2"/>
  <circle cx="135" cy="560" r="1.5" fill="#c9a96e" opacity="0.15"/>
  
  <circle cx="1100" cy="560" r="3" fill="#c9a96e" opacity="0.3"/>
  <circle cx="1080" cy="560" r="2" fill="#c9a96e" opacity="0.2"/>
  <circle cx="1065" cy="560" r="1.5" fill="#c9a96e" opacity="0.15"/>
</svg>
